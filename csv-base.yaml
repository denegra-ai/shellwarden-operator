# The hand-written part of the ClusterServiceVersion. make bundle (hack/gen-bundle.py) adds the
# install strategy (from config/rbac and config/manager), the owned CRDs' versions, alm-examples
# (from config/samples), relatedImages, the icon, createdAt, and the Agent Sandbox variant.
# Placeholders in CAPITALS are filled in by the generator.
apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  name: shellwarden-operator.vVERSION
  annotations:
    capabilities: Seamless Upgrades
    categories: AI/Machine Learning, Security
    containerImage: IMG
    createdAt: CREATED_AT
    description: Installs and upgrades NVIDIA OpenShell, the runtime that runs AI agents in kernel-confined sandboxes. Community project.
    repository: https://github.com/denegra-ai/shellwarden-operator
    support: Denegra (community)
    operatorframework.io/suggested-namespace: shellwarden-operator
    operatorhub.io/ui-metadata-max-k8s-version: "1.37"
    features.operators.openshift.io/disconnected: "true"
    features.operators.openshift.io/fips-compliant: "false"
    features.operators.openshift.io/proxy-aware: "false"
    features.operators.openshift.io/tls-profiles: "false"
    features.operators.openshift.io/token-auth-aws: "false"
    features.operators.openshift.io/token-auth-azure: "false"
    features.operators.openshift.io/token-auth-gcp: "false"
    features.operators.openshift.io/cnf: "false"
    features.operators.openshift.io/cni: "false"
    features.operators.openshift.io/csi: "false"
  labels:
    operatorframework.io/arch.amd64: supported
    operatorframework.io/os.linux: supported
spec:
  displayName: Denegra Shellwarden for NVIDIA OpenShell
  version: VERSION
  minKubeVersion: 1.29.0
  maturity: alpha
  provider:
    name: Denegra
    url: https://denegra.ai
  maintainers:
    - name: Denegra open source
      email: opensource@denegra.ai
  links:
    - name: Source and documentation
      url: https://github.com/denegra-ai/shellwarden-operator
    - name: NVIDIA OpenShell
      url: https://github.com/NVIDIA/OpenShell
    - name: Agent Sandbox (kubernetes-sigs)
      url: https://github.com/kubernetes-sigs/agent-sandbox
  keywords:
